# docker compose -f deploy/compose.yaml up -d --build
services:
  telegram:
    build: ..
    env_file: ../.env
    environment:
      DATA_DIR: /app/data
    volumes:
      - telegram-data:/app/data
    restart: unless-stopped
    stop_grace_period: 30s
    # Long polling uses outbound HTTPS only. The image checks /healthz internally.

volumes:
  telegram-data:
